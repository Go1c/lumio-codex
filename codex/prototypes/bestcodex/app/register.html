<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>创建账户 · BestCodex</title>
    <link rel="icon" href="../assets/icons/app-icon.jpg" />
    <link rel="stylesheet" href="../assets/prototype.css" />
  </head>
  <body>
    <div class="studio">
      <div class="toolbar">
        <div>
          <h1>App · 创建账户</h1>
          <p>验证码与协议，仍是同一套表单气质</p>
        </div>
        <div class="toolbar-actions">
          <a class="note" href="signed-out.html">返回</a>
          <div class="seg">
            <button type="button" data-theme-set="light">浅色</button>
            <button type="button" data-theme-set="dark">深色</button>
          </div>
        </div>
      </div>

      <div class="window">
        <header class="titlebar">
          <div class="traffic"><i></i><i></i><i></i></div>
          <div class="titlebar-name">BestCodex</div>
          <div></div>
        </header>
        <main class="win-main">
          <form class="form-wrap" action="provisioning.html">
            <span class="app-icon is-card" aria-hidden="true"><img src="../assets/icons/app-icon.jpg" alt="" /></span>
            <h2>创建账户</h2>
            <p class="lede">用邮箱验证码完成注册。</p>
            <label for="email">邮箱</label>
            <input class="field" id="email" type="email" placeholder="name@company.com" />
            <label for="code">验证码</label>
            <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 12px">
              <input class="field" id="code" inputmode="numeric" maxlength="6" style="margin: 0" />
              <button class="btn is-sm" type="button">发送</button>
            </div>
            <label for="password">密码</label>
            <input class="field" id="password" type="password" />
            <label for="confirm">确认密码</label>
            <input class="field" id="confirm" type="password" />
            <p class="quiet" style="margin: 4px 0 16px">创建账户即表示你同意服务条款与隐私政策。</p>
            <button class="btn is-block" type="submit">创建账户</button>
            <p class="note" style="text-align: center; margin-top: 16px">
              已有账户？<a href="login.html">登录</a>
            </p>
          </form>
        </main>
      </div>
    </div>
    <script src="../assets/prototype.js"></script>
  </body>
</html>
