<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>准备连接 · BestCodex</title>
    <link rel="icon" href="../assets/icons/app-icon.jpg" />
    <link rel="stylesheet" href="../assets/prototype.css" />
  </head>
  <body>
    <div class="studio">
      <div class="toolbar">
        <div>
          <h1>App · 准备连接</h1>
          <p>过渡页，不讲内部步骤黑话</p>
        </div>
        <div class="toolbar-actions">
          <a class="note" href="home.html">当作完成</a>
          <div class="seg">
            <button type="button" data-theme-set="light">浅色</button>
            <button type="button" data-theme-set="dark">深色</button>
          </div>
        </div>
      </div>

      <div class="window">
        <header class="titlebar">
          <div class="traffic"><i></i><i></i><i></i></div>
          <div class="titlebar-name">BestCodex</div>
          <div></div>
        </header>
        <main class="win-main welcome">
          <div>
            <span class="app-icon is-card" style="margin-left: auto; margin-right: auto" aria-hidden="true"><img src="../assets/icons/app-icon.jpg" alt="" /></span>
            <h2>正在准备</h2>
            <p>正在完成本机配置。这只需要几秒。</p>
            <div class="steps-v" style="margin: 8px auto 0; text-align: left">
              <div class="step-v is-done"><i></i><span>验证账户</span></div>
              <div class="step-v is-done"><i></i><span>准备连接</span></div>
              <div class="step-v is-now"><i></i><span>同步模型目录</span></div>
              <div class="step-v"><i></i><span>写入本机配置</span></div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="../assets/prototype.js"></script>
  </body>
</html>
