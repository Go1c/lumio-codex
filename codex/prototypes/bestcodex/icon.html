<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>正式图标 · BestCodex</title>
    <link rel="icon" href="assets/icons/app-icon.jpg" />
    <link rel="stylesheet" href="assets/prototype.css" />
  </head>
  <body>
    <main class="icon-lab">
      <p class="note"><a href="index.html">← 启动器设计稿</a></p>
      <div class="brand" style="margin-top: 18px">
        <span class="app-icon" aria-hidden="true"><img src="assets/icons/app-icon.jpg" alt="" /></span>
        BestCodex
      </div>
      <h1>正式图标</h1>
      <p class="note" style="max-width: 560px">
        已锁定：一对折纸小人，左青绿 = Codex，右珊瑚 = Claude，冰玻璃底。下面只验收它在浅色 / 深色里怎么站，不再出新方案。
      </p>
      <div class="seg" style="margin-top: 16px">
        <button type="button" data-theme-set="light">浅色</button>
        <button type="button" data-theme-set="dark">深色</button>
      </div>

      <div class="icon-stage light" style="margin-top: 28px">
        <figure>
          <span class="app-icon is-hero" style="margin: 0 auto"><img src="assets/icons/app-icon.jpg" alt="" /></span>
          <figcaption>浅底 · Dock / 欢迎页</figcaption>
        </figure>
        <figure>
          <span class="app-icon is-lg" style="margin: 0 auto"><img src="assets/icons/app-icon.jpg" alt="" /></span>
          <figcaption>浅底 · 官网 Hero</figcaption>
        </figure>
      </div>
      <div class="icon-stage dark">
        <figure>
          <span class="app-icon is-hero" style="margin: 0 auto"><img src="assets/icons/app-icon.jpg" alt="" /></span>
          <figcaption>深底 · 自己带着冰玻璃盘</figcaption>
        </figure>
        <figure>
          <span class="app-icon is-lg" style="margin: 0 auto"><img src="assets/icons/app-icon.jpg" alt="" /></span>
          <figcaption>深底 · 标题栏 / 设置</figcaption>
        </figure>
      </div>

      <h2 style="margin: 8px 0 6px; font-size: 22px; letter-spacing: -0.03em">尺寸</h2>
      <p class="note">界面用方裁：去掉源图上边的工作室留白，小人抬到视觉中心。小尺寸认的是青绿 / 珊瑚两块色，不是脸。</p>
      <div class="icon-sizes">
        <span class="app-icon" style="width: 16px; height: 16px; border-radius: 4px"><img src="assets/icons/app-icon.jpg" alt="" /></span>
        <span class="app-icon"><img src="assets/icons/app-icon.jpg" alt="" /></span>
        <span class="app-icon is-md"><img src="assets/icons/app-icon.jpg" alt="" /></span>
        <span class="app-icon is-card" style="margin: 0"><img src="assets/icons/app-icon.jpg" alt="" /></span>
        <span class="app-icon is-lg"><img src="assets/icons/app-icon.jpg" alt="" /></span>
      </div>

      <h2 style="margin: 32px 0 6px; font-size: 22px; letter-spacing: -0.03em">用在壳上</h2>
      <div class="map" style="margin-top: 14px">
        <section>
          <h2>欢迎页</h2>
          <a href="app/signed-out.html">未登录</a>
          <a href="app/login.html">登录</a>
          <a href="app/settings.html">设置 · 账户行</a>
        </section>
        <section>
          <h2>官网与帮助</h2>
          <a href="site/index.html">Hero</a>
          <a href="site/help.html">帮助顶栏</a>
        </section>
      </div>
      <p class="quiet" style="margin-top: 28px">
        源文件：<code>codex/assets/brand/bestcodex-icon.jpg</code>。原型里的副本在
        <code>prototypes/bestcodex/assets/icons/app-icon.jpg</code>。
      </p>
    </main>
    <script src="assets/prototype.js"></script>
  </body>
</html>
