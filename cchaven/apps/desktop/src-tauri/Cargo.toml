[package]
name = "fns-workspace-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "fns_workspace_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fns-workspace-desktop"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
blake3.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories.workspace = true
diffy.workspace = true
hex.workspace = true
httparse = "1.10.1"
keyring = { version = "3", features = ["apple-native"] }
open = "5"
portable-pty = "0.8"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "native-tls",
] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9.34"
sha2.workspace = true
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-shell = "2"
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
uuid.workspace = true
zeroize = { workspace = true, features = ["serde"] }

fns-agent = { path = "../../../bins/fns-agent" }
fns-fs = { path = "../../../crates/fns-fs" }
fns-observability = { path = "../../../crates/fns-observability" }
fns-platform = { path = "../../../crates/fns-platform" }
fns-protocol = { path = "../../../crates/fns-protocol" }
fns-sync-core = { path = "../../../crates/fns-sync-core" }
fns-transport = { path = "../../../crates/fns-transport" }
test-sync = { path = "../../../bins/test-sync" }

[dev-dependencies]
futures-util.workspace = true
tokio-tungstenite.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
