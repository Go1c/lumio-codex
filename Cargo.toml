[workspace]
resolver = "3"
members = [
  "crates/fns-protocol",
  "crates/fns-sync-core",
  "crates/fns-fs",
  "crates/fns-transport",
  "crates/fns-platform",
  "bins/fns-agent",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
blake3 = "1.8.3"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
sha2 = "0.10.9"
thiserror = "2.0.18"
unicode-normalization = "0.1.25"
uuid = { version = "1.20.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
