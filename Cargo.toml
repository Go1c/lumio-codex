[workspace]
resolver = "3"
members = [
  "crates/fns-protocol",
  "crates/fns-sync-core",
  "crates/fns-fs",
  "crates/fns-transport",
  "crates/fns-platform",
  "bins/fns-agent",
  "bins/test-sync",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
blake3 = "1.8.3"
bytes = "1.12.1"
cap-fs-ext = "3.4.5"
cap-std = "3.4.5"
rustix = { version = "1.1.4", features = ["fs"] }
clap = { version = "4.6.4", features = ["derive"] }
crossbeam-channel = "0.5.15"
directories = "5"
diffy = "0.4.2"
filetime = "0.2.29"
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }
globset = "0.4.18"
hex = "0.4.3"
http = "1.4.2"
notify = "8.2.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
security-framework = "3.7.0"
security-framework-sys = "2.17.0"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "handshake"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json"] }
unicode-normalization = "0.1.25"
url = "2.5.8"
uuid = { version = "1.20.0", features = ["serde", "v4"] }
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
