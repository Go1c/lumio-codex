name: Internal unsigned build artifacts

on:
  pull_request:
  push:
    branches: [publish]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-artifacts:
    name: Windows x64 internal unsigned
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/codex-plus-manager/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Frontend tests
        working-directory: apps/codex-plus-manager
        run: npm test

      - name: TypeScript check
        working-directory: apps/codex-plus-manager
        run: npm run check

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Rust tests
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release

      - name: Resolve internal version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^[vV]', '' -replace '[^0-9A-Za-z._-]', '-'
          if (-not $version -or $version -eq "publish") {
            $version = "0.0.0-internal-${{ github.run_number }}"
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Stage Windows app files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/app | Out-Null
          Copy-Item target/release/lumio-codex.exe dist/windows/app/
          Copy-Item target/release/lumio-codex-launcher.exe dist/windows/app/

      - name: Build Windows portable archive
        shell: pwsh
        run: |
          $version = $env:PACKAGE_VERSION
          $archive = "dist/windows/LumioCodex-$version-windows-x64-portable-internal-unsigned.zip"
          Compress-Archive -Path dist/windows/app/* -DestinationPath $archive -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = $env:PACKAGE_VERSION
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "makensis"
          }
          Push-Location scripts/installer/windows
          & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$version" LumioCodex.nsi
          Pop-Location

      - name: Verify Windows artifact names
        shell: pwsh
        run: |
          $version = $env:PACKAGE_VERSION
          $expected = @(
            "dist/windows/LumioCodex-$version-windows-x64-portable-internal-unsigned.zip",
            "dist/windows/LumioCodex-$version-windows-x64-setup-internal-unsigned.exe"
          )
          foreach ($artifact in $expected) {
            if (-not (Test-Path $artifact)) {
              throw "Missing internal artifact: $artifact"
            }
          }

      - name: Upload Windows internal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumio-codex-windows-x64-internal-unsigned-${{ github.run_number }}
          path: |
            dist/windows/LumioCodex-*-windows-x64-portable-internal-unsigned.zip
            dist/windows/LumioCodex-*-windows-x64-setup-internal-unsigned.exe
          if-no-files-found: error
          retention-days: 14

  macos-dmg:
    name: macOS ${{ matrix.arch }} internal unsigned
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/codex-plus-manager/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build macOS DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#V}"
          VERSION="$(printf '%s' "$VERSION" | tr -c '0-9A-Za-z._-' '-')"
          if [ -z "$VERSION" ] || [ "$VERSION" = "publish" ]; then
            VERSION="0.0.0-internal-${GITHUB_RUN_NUMBER}"
          fi
          BINARY_DIR="$PWD/target/${{ matrix.target }}/release" bash scripts/installer/macos/package-dmg.sh "$VERSION" "${{ matrix.arch }}"

      - name: Verify macOS bundle structure
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find dist/macos -maxdepth 1 -type f -name 'LumioCodex-*-internal-unsigned.dmg' -print -quit)"
          test -n "$DMG"
          TEMP_PARENT="${TMPDIR:-/tmp}"
          TEMP_PARENT="${TEMP_PARENT%/}"
          MOUNT_POINT="$(mktemp -d "$TEMP_PARENT/lumio-codex-verify.XXXXXX")"
          ATTACHED=0
          cleanup_mount() {
            if [ "$ATTACHED" -eq 1 ]; then
              hdiutil detach "$MOUNT_POINT" >/dev/null
            fi
            rmdir "$MOUNT_POINT"
          }
          trap cleanup_mount EXIT
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_POINT" >/dev/null
          ATTACHED=1
          APP="$MOUNT_POINT/Lumio Codex.app"
          test -L "$MOUNT_POINT/Applications"
          test "$(readlink "$MOUNT_POINT/Applications")" = "/Applications"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/PkgInfo"
          test -x "$APP/Contents/MacOS/lumio-codex"
          test -x "$APP/Contents/Helpers/lumio-codex-launcher"
          test "$(find "$MOUNT_POINT" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')" = "1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "games.lumio.codex"
          plutil -lint "$APP/Contents/Info.plist" >/dev/null
          hdiutil detach "$MOUNT_POINT" >/dev/null
          ATTACHED=0

      - name: Upload macOS internal DMG
        uses: actions/upload-artifact@v4
        with:
          name: lumio-codex-macos-${{ matrix.arch }}-internal-unsigned-${{ github.run_number }}
          path: dist/macos/LumioCodex-*-macos-${{ matrix.arch }}-internal-unsigned.dmg
          if-no-files-found: error
          retention-days: 14
