name: Internal unsigned build artifacts

on:
  pull_request:
  push:
    branches: [publish]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "After build, upload to S3 and create a GitHub prerelease"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-artifacts:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
        working-directory: codex
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: codex/apps/codex-plus-manager/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Install frontend dependencies
        working-directory: codex/apps/codex-plus-manager
        run: npm ci

      - name: Frontend tests
        working-directory: codex/apps/codex-plus-manager
        run: npm test

      - name: TypeScript check
        working-directory: codex/apps/codex-plus-manager
        run: npm run check

      - name: Build frontend
        working-directory: codex/apps/codex-plus-manager
        run: npm run vite:build

      - name: Resolve internal version
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version="${version#V}"
          version="$(printf '%s' "$version" | tr -c '0-9A-Za-z._-' '-')"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ -z "$version" ] || [ "$version" = "publish" ]; then
            desktop="$(node -e "const fs=require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('apps/codex-plus-manager/src-tauri/tauri.conf.json','utf8')).version)")"
            version="${desktop}-internal-${GITHUB_RUN_NUMBER}"
          fi
          quad="$(node -e "const v=process.argv[1]; const n=[...String(v).matchAll(/\d+/g)].map(m=>Number(m[0])); while(n.length<4) n.push(0); process.stdout.write(n.slice(0,4).join('.'))" "$version")"
          {
            echo "PACKAGE_VERSION=${version}"
            echo "PRODUCT_VERSION_QUAD=${quad}"
          } >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=${version}"
          echo "PRODUCT_VERSION_QUAD=${quad}"

      - name: Rust tests
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release

      - name: Decide Windows signing mode
        id: sign
        env:
          SIGN_WINDOWS: ${{ github.event_name != 'pull_request' && secrets.SIGNPATH_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "${SIGN_WINDOWS}" = "true" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "WINDOWS_OUT_SUFFIX=" >> "$GITHUB_ENV"
            echo "artifact_suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "WINDOWS_OUT_SUFFIX=-internal-unsigned" >> "$GITHUB_ENV"
            echo "artifact_suffix=-internal-unsigned" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage Windows app files
        run: |
          set -euo pipefail
          mkdir -p dist/windows/app
          cp target/release/lumio-codex.exe dist/windows/app/
          cp target/release/lumio-codex-launcher.exe dist/windows/app/

      - name: Build Windows MSIX (unsigned store scaffold)
        run: |
          set -euo pipefail
          node --test scripts/installer/windows/msix/map-package-version.test.mjs scripts/installer/windows/msix/pack-msix.test.mjs
          pwsh -NoProfile -NonInteractive -File ./scripts/installer/windows/msix/Pack-Msix.ps1 -SelfTest < /dev/null
          pwsh -NoProfile -NonInteractive -File ./scripts/installer/windows/msix/Pack-Msix.ps1 -PackageVersion "$PACKAGE_VERSION" < /dev/null

      - name: Stamp Windows version resources
        if: steps.sign.outputs.sign == 'true'
        run: |
          set -euo pipefail
          rcedit="${RUNNER_TEMP}/rcedit-x64.exe"
          curl -fsSL -o "$rcedit" "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe"
          for exe in dist/windows/app/lumio-codex.exe dist/windows/app/lumio-codex-launcher.exe; do
            "$rcedit" "$exe" \
              --set-version-string ProductName "Lumio Codex" \
              --set-version-string FileDescription "Lumio Codex" \
              --set-version-string CompanyName "Lumio" \
              --set-file-version "$PRODUCT_VERSION_QUAD" \
              --set-product-version "$PRODUCT_VERSION_QUAD"
          done

      - name: Upload unsigned Windows binaries for SignPath
        if: steps.sign.outputs.sign == 'true'
        id: upload-windows-binaries
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-binaries-${{ github.run_number }}
          path: |
            codex/dist/windows/app/lumio-codex.exe
            codex/dist/windows/app/lumio-codex-launcher.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows binaries with SignPath
        if: steps.sign.outputs.sign == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: windows-binaries
          github-artifact-id: ${{ steps.upload-windows-binaries.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: codex/dist/windows/signed-binaries

      - name: Replace staged binaries with signed copies
        if: steps.sign.outputs.sign == 'true'
        run: |
          set -euo pipefail
          signed="dist/windows/signed-binaries"
          codex="$(find "$signed" -name lumio-codex.exe -print -quit)"
          launcher="$(find "$signed" -name lumio-codex-launcher.exe -print -quit)"
          if [ -z "$codex" ] || [ -z "$launcher" ]; then
            echo "SignPath did not return both signed Windows binaries" >&2
            exit 1
          fi
          cp -f "$codex" dist/windows/app/lumio-codex.exe
          cp -f "$launcher" dist/windows/app/lumio-codex-launcher.exe

      - name: Build Windows portable archive
        run: |
          set -euo pipefail
          archive="dist/windows/LumioCodex-${PACKAGE_VERSION}-windows-x64-portable${WINDOWS_OUT_SUFFIX}.zip"
          pwsh -NoProfile -NonInteractive -Command "Compress-Archive -Path dist/windows/app/* -DestinationPath '$archive' -Force" < /dev/null

      - name: Build Windows installer
        env:
          # Git Bash rewrites unquoted /INPUTCHARSET to C:/Program Files/Git/INPUTCHARSET.
          MSYS_NO_PATHCONV: "1"
        run: |
          set -euo pipefail
          makensis="makensis"
          if [ -f "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            makensis="/c/Program Files (x86)/NSIS/makensis.exe"
          else
            pf86="$(printenv 'ProgramFiles(x86)' || true)"
            if [ -n "$pf86" ] && [ -f "${pf86}/NSIS/makensis.exe" ]; then
              makensis="${pf86}/NSIS/makensis.exe"
            fi
          fi
          (
            cd scripts/installer/windows
            "$makensis" -INPUTCHARSET UTF8 "-DVERSION=${PACKAGE_VERSION}" "-DOUT_SUFFIX=${WINDOWS_OUT_SUFFIX}" "-DPRODUCT_VERSION_QUAD=${PRODUCT_VERSION_QUAD}" LumioCodex.nsi
          )

      - name: Upload unsigned Windows setup for SignPath
        if: steps.sign.outputs.sign == 'true'
        id: upload-windows-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-setup-${{ github.run_number }}
          path: codex/dist/windows/LumioCodex-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows setup with SignPath
        if: steps.sign.outputs.sign == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: windows-setup
          github-artifact-id: ${{ steps.upload-windows-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: codex/dist/windows/signed-setup

      - name: Replace setup with signed copy
        if: steps.sign.outputs.sign == 'true'
        run: |
          set -euo pipefail
          dest="dist/windows/LumioCodex-${PACKAGE_VERSION}-windows-x64-setup.exe"
          signed="$(find dist/windows/signed-setup -name 'LumioCodex-*-windows-x64-setup.exe' -print -quit)"
          if [ -z "$signed" ]; then
            echo "SignPath did not return a signed Windows setup" >&2
            exit 1
          fi
          cp -f "$signed" "$dest"

      - name: Verify Windows Authenticode signatures
        if: steps.sign.outputs.sign == 'true'
        run: |
          set -euo pipefail
          pwsh -NoProfile -NonInteractive -Command '
            $files = @(
              "dist/windows/app/lumio-codex.exe",
              "dist/windows/app/lumio-codex-launcher.exe",
              "dist/windows/LumioCodex-$env:PACKAGE_VERSION-windows-x64-setup.exe"
            )
            foreach ($file in $files) {
              $sig = Get-AuthenticodeSignature $file
              if (-not $sig.SignerCertificate) {
                throw "Missing Authenticode signer: $file"
              }
              if ($sig.Status -eq "NotSigned" -or $sig.Status -eq "HashMismatch") {
                throw "Invalid Authenticode status $($sig.Status): $file"
              }
            }
          ' < /dev/null

      - name: Verify Windows artifact names
        run: |
          set -euo pipefail
          expected=(
            "dist/windows/LumioCodex-${PACKAGE_VERSION}-windows-x64-portable${WINDOWS_OUT_SUFFIX}.zip"
            "dist/windows/LumioCodex-${PACKAGE_VERSION}-windows-x64-setup${WINDOWS_OUT_SUFFIX}.exe"
            "dist/windows/LumioCodex-${PACKAGE_VERSION}-windows-x64-store-unsigned.msix"
          )
          for artifact in "${expected[@]}"; do
            if [ ! -f "$artifact" ]; then
              echo "Missing Windows artifact: $artifact" >&2
              exit 1
            fi
          done

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumio-codex-windows-x64${{ steps.sign.outputs.artifact_suffix }}-${{ github.run_number }}
          path: |
            codex/dist/windows/LumioCodex-*-windows-x64-portable*.zip
            codex/dist/windows/LumioCodex-*-windows-x64-setup*.exe
            codex/dist/windows/LumioCodex-*-windows-x64-store-unsigned.msix
          if-no-files-found: error
          retention-days: 14

  macos-dmg:
    name: macOS ${{ matrix.arch }} internal unsigned
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    defaults:
      run:
        working-directory: codex
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: codex/apps/codex-plus-manager/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: codex/apps/codex-plus-manager
        run: npm ci

      - name: Build frontend
        working-directory: codex/apps/codex-plus-manager
        run: npm run vite:build

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build macOS DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#V}"
          VERSION="$(printf '%s' "$VERSION" | tr -c '0-9A-Za-z._-' '-')"
          if [ -z "$VERSION" ] || [ "$VERSION" = "publish" ]; then
            VERSION="$(python3 -c 'import json; print(json.load(open("apps/codex-plus-manager/src-tauri/tauri.conf.json"))["version"])')-internal-${GITHUB_RUN_NUMBER}"
          fi
          BINARY_DIR="$PWD/target/${{ matrix.target }}/release" bash scripts/installer/macos/package-dmg.sh "$VERSION" "${{ matrix.arch }}"

      - name: Verify macOS bundle structure
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find dist/macos -maxdepth 1 -type f -name 'LumioCodex-*-internal-unsigned.dmg' -print -quit)"
          test -n "$DMG"
          TEMP_PARENT="${TMPDIR:-/tmp}"
          TEMP_PARENT="${TEMP_PARENT%/}"
          MOUNT_POINT="$(mktemp -d "$TEMP_PARENT/lumio-codex-verify.XXXXXX")"
          ATTACHED=0
          cleanup_mount() {
            if [ "$ATTACHED" -eq 1 ]; then
              hdiutil detach "$MOUNT_POINT" >/dev/null
            fi
            rmdir "$MOUNT_POINT"
          }
          trap cleanup_mount EXIT
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_POINT" >/dev/null
          ATTACHED=1
          APP="$MOUNT_POINT/BestCodex.app"
          test -L "$MOUNT_POINT/Applications"
          test "$(readlink "$MOUNT_POINT/Applications")" = "/Applications"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/PkgInfo"
          test -x "$APP/Contents/MacOS/lumio-codex"
          test -x "$APP/Contents/MacOS/fns-agent"
          node scripts/sync-components/verify.mjs sidecar "$APP/Contents/MacOS/fns-agent" "darwin-${{ matrix.arch }}"
          node scripts/sync-components/verify.mjs remote "$APP/Contents/Resources/remote/linux-x86_64"
          test -x "$APP/Contents/Helpers/lumio-codex-launcher"
          test "$(find "$MOUNT_POINT" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')" = "1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "games.lumio.codex"
          plutil -lint "$APP/Contents/Info.plist" >/dev/null
          hdiutil detach "$MOUNT_POINT" >/dev/null
          ATTACHED=0

      - name: Upload macOS internal DMG
        uses: actions/upload-artifact@v4
        with:
          name: lumio-codex-macos-${{ matrix.arch }}-internal-unsigned-${{ github.run_number }}
          path: codex/dist/macos/LumioCodex-*-macos-${{ matrix.arch }}-internal-unsigned.dmg
          if-no-files-found: error
          retention-days: 14

  publish-internal:
    name: Publish S3 + GitHub prerelease
    needs: [windows-artifacts, macos-dmg]
    # Push to publish must ship: S3 + latest-internal.json + GitHub prerelease.
    # Dispatch without the publish checkbox stays build-only.
    if: >
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/publish') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_PUBLIC_BASE: ${{ secrets.S3_PUBLIC_BASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require S3 secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in S3_ENDPOINT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY S3_BUCKET S3_PUBLIC_BASE; do
            if [ -z "${!key:-}" ]; then
              echo "Missing configured secret mapped to env: $key" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set repo secrets: S3_ENDPOINT S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_BUCKET S3_PUBLIC_BASE" >&2
            exit 1
          fi

      - name: Resolve publish version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION="${VERSION#V}"
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="$(python3 -c 'import json; print(json.load(open("codex/apps/codex-plus-manager/src-tauri/tauri.conf.json"))["version"])')-internal-${GITHUB_RUN_NUMBER}"
            TAG="internal-run-${GITHUB_RUN_NUMBER}"
          fi
          VERSION="$(printf '%s' "$VERSION" | tr -c '0-9A-Za-z._-' '-')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prefix=releases/${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: lumio-codex-*-${{ github.run_number }}
          merge-multiple: true

      - name: Stage release files + checksums
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p dist/publish
          shopt -s nullglob
          files=(artifacts/LumioCodex-*)
          if [ "${#files[@]}" -lt 4 ]; then
            echo "Expected at least 4 LumioCodex artifacts, found ${#files[@]}" >&2
            find artifacts -type f -print >&2 || true
            exit 1
          fi
          for f in "${files[@]}"; do
            base="$(basename "$f")"
            case "$base" in
              *"-$VERSION-"*) cp -f "$f" "dist/publish/$base" ;;
            esac
          done
          if [ "$(find dist/publish -type f | wc -l | tr -d ' ')" -eq 0 ]; then
            for f in "${files[@]}"; do
              cp -f "$f" "dist/publish/$(basename "$f")"
            done
          fi
          win_zip=(dist/publish/LumioCodex-*-windows-x64-portable*.zip)
          win_setup=(dist/publish/LumioCodex-*-windows-x64-setup*.exe)
          mac_dmg=(dist/publish/LumioCodex-*-macos-*.dmg)
          if [ "${#win_zip[@]}" -ne 1 ] || [ "${#win_setup[@]}" -ne 1 ] || [ "${#mac_dmg[@]}" -ne 2 ]; then
            echo "Expected 1 Windows zip, 1 Windows setup, 2 macOS DMGs" >&2
            ls -la dist/publish >&2 || true
            exit 1
          fi
          (
            cd dist/publish
            sha256sum LumioCodex-* | tee SHA256SUMS.txt
          )
          echo "count=$(find dist/publish -type f ! -name SHA256SUMS.txt | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          ls -la dist/publish

      - name: Upload to S3
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${{ steps.ver.outputs.prefix }}"
          aws --endpoint-url "$S3_ENDPOINT" s3 sync dist/publish "s3://${S3_BUCKET}/${PREFIX}/" --no-progress
          PUBLIC_BASE="${S3_PUBLIC_BASE%/}"
          {
            echo "{"
            echo "  \"channel\": \"internal\","
            echo "  \"version\": \"${{ steps.ver.outputs.version }}\","
            echo "  \"tag\": \"${{ steps.ver.outputs.tag }}\","
            echo "  \"published_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
            echo "  \"commit\": \"${GITHUB_SHA}\","
            echo "  \"assets\": ["
            first=1
            for f in dist/publish/LumioCodex-*; do
              name="$(basename "$f")"
              case "$name" in
                SHA256SUMS.txt) continue ;;
              esac
              signed=false
              case "$name" in
                *internal-unsigned*) signed=false ;;
                *-windows-*) signed=true ;;
              esac
              if [ "$first" -eq 1 ]; then first=0; else echo ","; fi
              printf '    {"name":"%s","url":"%s/%s/%s","signed":%s}' \
                "$name" "$PUBLIC_BASE" "${{ steps.ver.outputs.version }}" "$name" "$signed"
            done
            echo
            echo "  ]"
            echo "}"
          } > dist/latest-internal.json
          aws --endpoint-url "$S3_ENDPOINT" s3 cp dist/latest-internal.json \
            "s3://${S3_BUCKET}/releases/latest-internal.json" --content-type application/json --no-progress
          echo "S3 mirror: ${PUBLIC_BASE}/${{ steps.ver.outputs.version }}/"
          echo "Pointer: ${PUBLIC_BASE%/releases}/releases/latest-internal.json"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          PUBLIC_BASE="${S3_PUBLIC_BASE%/}"
          NOTES="$(mktemp)"
          {
            echo "## Lumio Codex ${VERSION} (internal)"
            echo
            echo "内部通道。Windows 若文件名不含 internal-unsigned 则为 SignPath Authenticode 已签名；macOS 仍为未签名，请右键打开。"
            echo
            echo "### CDN (primary)"
            echo
            echo "- Index: \`${PUBLIC_BASE}/${VERSION}/\`"
            echo "- Pointer: \`${PUBLIC_BASE%/releases}/releases/latest-internal.json\`"
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat dist/publish/SHA256SUMS.txt
            echo '```'
            echo
            echo "GitHub Release assets are the fallback mirror of the same files."
          } > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/publish/* --clobber
            gh release edit "$TAG" --notes-file "$NOTES" --prerelease --title "Lumio Codex ${VERSION} (internal)"
          else
            gh release create "$TAG" dist/publish/* \
              --title "Lumio Codex ${VERSION} (internal)" \
              --notes-file "$NOTES" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
