name: Public release gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-required:
    name: Signing prerequisites are required
    runs-on: ubuntu-latest
    steps:
      - name: Block unsigned public releases
        shell: bash
        run: |
          echo "SIGNING_REQUIRED: configure Apple Developer ID signing and notarization, Windows code signing, protected CI credentials, the S3 update base, and a rollback drill before enabling public releases." >&2
          exit 1
